name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  # fixed revisions of what the build takes from other repositories (replace the compiler by a release binary when there is one)
  COMPILER_REF: daf1a3218dc4b53f76b91da3565c3d3edec3ab0a
  CORE_REF: 529ec49eb4d740e403a4725bcd881620fa8b74d0
  # the canvas client (demos/ghost-todo-canvas) builds on the widgets and the browser glue
  GRAPHICS_REF: 3b147944f94916639962af4c8a4a7008ce0508ba
  RUNTIME_REF: dc56bd70aba3bbf23ae8ad82d5ffc6dd8e4106e2
  # the host the module is tested against: fsharp-wasm-edge at a fixed revision (the module and the host are developed apart)
  EDGE_REF: 772ee11c13f4b587de8029c72d6117a293a57736

jobs:
  # The .NET libraries (the reference) and the portable layer with its tests.
  dotnet:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: fsharp-wasm-core
        uses: actions/checkout@v6
        with:
          repository: fsharp-wasm/fsharp-wasm-core
          ref: ${{ env.CORE_REF }}
          path: core
      - name: fsharp-wasm-graphics
        uses: actions/checkout@v6
        with:
          repository: fsharp-wasm/fsharp-wasm-graphics
          ref: ${{ env.GRAPHICS_REF }}
          path: graphics
      - name: fsharp-wasm-runtime
        uses: actions/checkout@v6
        with:
          repository: fsharp-wasm/fsharp-wasm-runtime
          ref: ${{ env.RUNTIME_REF }}
          path: runtime
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Build and test
        env:
          FSHARP_WASM_CORE_DIR: ${{ github.workspace }}/core
          FSHARP_GRAPHICS_DIR: ${{ github.workspace }}/graphics
          FSHARP_RUNTIME_DIR: ${{ github.workspace }}/runtime
        run: dotnet test FSharp.Wasm.slnx -c Release

  # The module compiled by fsharp-wasm, and run on every platform that can run here by the host of fsharp-wasm-edge (the contract between them).
  module:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: fsharp-wasm-core
        uses: actions/checkout@v6
        with:
          repository: fsharp-wasm/fsharp-wasm-core
          ref: ${{ env.CORE_REF }}
          path: core
      - name: fsharp-wasm-graphics
        uses: actions/checkout@v6
        with:
          repository: fsharp-wasm/fsharp-wasm-graphics
          ref: ${{ env.GRAPHICS_REF }}
          path: graphics
      - name: fsharp-wasm-runtime
        uses: actions/checkout@v6
        with:
          repository: fsharp-wasm/fsharp-wasm-runtime
          ref: ${{ env.RUNTIME_REF }}
          path: runtime
      - name: Host checkout (fsharp-wasm-edge)
        uses: actions/checkout@v6
        with:
          repository: fsharp-wasm/fsharp-wasm-edge
          ref: ${{ env.EDGE_REF }}
          path: edge
      - name: Compiler checkout
        uses: actions/checkout@v6
        with:
          repository: fsharp-wasm/fsharp-wasm
          ref: ${{ env.COMPILER_REF }}
          path: compiler
      - name: Compiler submodules
        run: git -C compiler submodule update --init --depth 1 vendor/Fable vendor/fsharp core

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - uses: oven-sh/setup-bun@v2

      # vendor/fsharp pins the 10.0.3xx SDK band (no roll-forward): 10.0.303 builds the patched F# compiler, cached per revision
      - name: Patched F# compiler (cache)
        id: fsc
        uses: actions/cache@v5
        with:
          path: compiler/vendor/fsharp/artifacts/bin/fsc/Release/net10.0
          key: fsc-${{ runner.os }}-${{ env.COMPILER_REF }}
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            10.0.303
            10.0.x
      - name: Patched F# compiler (build)
        if: steps.fsc.outputs.cache-hit != 'true'
        working-directory: compiler/vendor/fsharp
        run: |
          mkdir -p artifacts
          ./build/build.sh -c Release
          test -f artifacts/bin/fsc/Release/net10.0/fsc.dll

      # a fixed version (the one the host's checks were made with); no call to the GitHub API, whose unauthenticated limit
      # failed this step when three runs started at once
      - name: Install wasm-tools
        env:
          WASM_TOOLS: 1.263.0
        run: |
          curl -sSfL --retry 4 "https://github.com/bytecodealliance/wasm-tools/releases/download/v${WASM_TOOLS}/wasm-tools-${WASM_TOOLS}-x86_64-linux.tar.gz" | tar xz -C "$RUNNER_TEMP"
          sudo install -m755 "$RUNNER_TEMP/wasm-tools-${WASM_TOOLS}-x86_64-linux/wasm-tools" /usr/local/bin/wasm-tools
          wasm-tools --version

      - name: Build GhostTodo.wasm (string ABI exports)
        env:
          FSHARP_WASM_CORE_DIR: ${{ github.workspace }}/core
          FSHARP_WASM_DIR: ${{ github.workspace }}/compiler
          FSHARP_COMPILER: ${{ github.workspace }}/compiler/vendor/fsharp/artifacts/bin/fsc/Release/net10.0/fsc.dll
        run: bash build/build.sh

      # the client with widgets on a canvas: the same compiler, the widgets and the browser glue at fixed revisions
      - name: Build GhostTodoCanvas.wasm and its page
        env:
          FSHARP_WASM_CORE_DIR: ${{ github.workspace }}/core
          FSHARP_GRAPHICS_DIR: ${{ github.workspace }}/graphics
          FSHARP_RUNTIME_DIR: ${{ github.workspace }}/runtime
          FSHARP_WASM_DIR: ${{ github.workspace }}/compiler
          FSHARP_COMPILER: ${{ github.workspace }}/compiler/vendor/fsharp/artifacts/bin/fsc/Release/net10.0/fsc.dll
        run: bash build/build.sh --module canvas

      - name: The module on every platform
        working-directory: edge
        env:
          GHOST_WASM: ${{ github.workspace }}/dist/GhostTodo.wasm
        run: |
          npm ci
          node build/package.mjs
          node tests/platforms/run.mjs

      # one locked Playwright (the runtime's) for the browser and the tests; the host's core and the module serve the API, the page of the canvas client is served beside it
      - name: Chromium for the canvas client
        working-directory: runtime
        run: |
          npm ci --ignore-scripts
          npx playwright install --with-deps chromium

      - name: The canvas client in Chromium, next to the page of the host
        env:
          EDGE_DIR: ${{ github.workspace }}/edge
          FSHARP_RUNTIME_DIR: ${{ github.workspace }}/runtime
        run: node tests/e2e/canvas.mjs

      - uses: actions/upload-artifact@v7
        with:
          name: module
          path: |
            dist/GhostTodo.wasm
            dist/GhostTodoCanvas.wasm
            dist/canvas
