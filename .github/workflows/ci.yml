name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  # fixed revisions of what the build takes from other repositories (replace the compiler by a release binary when there is one)
  COMPILER_REF: 8976acca44ba4edc0ee45c47d8bee0db2cec00f0
  CORE_REF: 1c592e748a0c93ba8b040b21b55b808322dbd3aa

jobs:
  # The .NET libraries (the reference) and the portable layer with its tests.
  dotnet:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: fsharp-wasm-core
        uses: actions/checkout@v6
        with:
          repository: fsharp-wasm/fsharp-wasm-core
          ref: ${{ env.CORE_REF }}
          path: core
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Build and test
        env:
          FSHARP_WASM_CORE_DIR: ${{ github.workspace }}/core
        run: dotnet test FSharp.Wasm.slnx -c Release

  # The module compiled by fsharp-wasm and run on every platform that can run here.
  platforms:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: fsharp-wasm-core
        uses: actions/checkout@v6
        with:
          repository: fsharp-wasm/fsharp-wasm-core
          ref: ${{ env.CORE_REF }}
          path: core
      - name: Compiler checkout
        uses: actions/checkout@v6
        with:
          repository: fsharp-wasm/fsharp-wasm
          ref: ${{ env.COMPILER_REF }}
          path: compiler
      - name: Compiler submodules
        run: git -C compiler submodule update --init --depth 1 vendor/Fable vendor/fsharp core

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - uses: oven-sh/setup-bun@v2

      # vendor/fsharp pins the 10.0.3xx SDK band (no roll-forward): 10.0.303 builds the patched F# compiler, cached per revision
      - name: Patched F# compiler (cache)
        id: fsc
        uses: actions/cache@v5
        with:
          path: compiler/vendor/fsharp/artifacts/bin/fsc/Release/net10.0
          key: fsc-${{ runner.os }}-${{ env.COMPILER_REF }}
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            10.0.303
            10.0.x
      - name: Patched F# compiler (build)
        if: steps.fsc.outputs.cache-hit != 'true'
        working-directory: compiler/vendor/fsharp
        run: |
          mkdir -p artifacts
          ./build/build.sh -c Release
          test -f artifacts/bin/fsc/Release/net10.0/fsc.dll

      - name: Install wasm-tools
        run: |
          RELEASE_URL=$(curl -sSf https://api.github.com/repos/bytecodealliance/wasm-tools/releases/latest \
            | python3 -c "import sys,json; d=json.load(sys.stdin); a=[x['browser_download_url'] for x in d['assets'] if 'x86_64-linux' in x['name'] and x['name'].endswith('.tar.gz')]; print(a[0])")
          curl -sSLO "$RELEASE_URL"
          tar xzf wasm-tools-*.tar.gz
          find . -maxdepth 2 -name wasm-tools -type f | head -1 | xargs -I{} sudo install -m755 {} /usr/local/bin/wasm-tools
          wasm-tools --version

      - name: Build GhostTodo.wasm (string ABI exports)
        env:
          FSHARP_WASM_CORE_DIR: ${{ github.workspace }}/core
          FSHARP_WASM_DIR: ${{ github.workspace }}/compiler
          FSHARP_COMPILER: ${{ github.workspace }}/compiler/vendor/fsharp/artifacts/bin/fsc/Release/net10.0/fsc.dll
        run: bash build/build.sh

      - name: Package the platforms
        run: |
          npm install
          node build/package.mjs
      - name: The same scenario on every platform
        run: node tests/platforms/run.mjs

      - uses: actions/upload-artifact@v7
        with:
          name: platforms
          path: dist/platforms
